[pytest]
# ⚠️ 这个文件放在 tests/ 里而不是仓库根，是**故意的、必须的**：
#
# 本仓库是 ComfyUI 插件 —— 仓库根目录本身就是 `__init__.py`（插件入口，且用了
# `from .anima_x import ...` 相对导入）。pytest 会为测试模块所在目录向上一级寻找包边界，
# 并把该 `__init__.py` 当「包的作用域模块」导入；因为它只能作为包内模块导入（相对导入），
# 于是必然 `ImportError: attempted relative import with no known parent package`
# → 所有用例 setup ERROR。
#
# 实测（pytest 9.1.1）：`rootdir` 由**配置文件所在目录**决定。
# 把配置放在 tests/ 里，rootpath 就是 tests/，pytest 不再向上找仓库根，
# 因而不导入插件 `__init__.py`。这些方案**全部实测无效**，别再试：
#   ✗ import-mode=importlib（pytest 9 的 ini 里没有这个选项）
#   ✗ pythonpath = .
#   ✗ collect_ignore / conftest 里的 collect_ignore
#   ✗ tests/__init__.py
#   ✗ --import-mode=append
#   ✗ --rootdir 覆盖（配置仍在仓库根时）
#
# 因此：**在仓库根跑 `pytest` 不会工作，请用 `pytest tests` 或
# `python tests/run_tests.py`（推荐，会顺带跑 ai_verify 与 JS 测试）。**

testpaths = .

# 各层说明见 tests/README.md
norecursedirs = integration repro js tools shots __pycache__

# 顶层附带 integration / repro 标记的脚本即使被收集也会被排除（双保险）
addopts = -m "not integration and not repro"

markers =
    unit: 纯离线单元/静态回归（CI 必跑）
    integration: 需要真实浏览器 + 真实 ComfyUI(:8188)（仅本机跑）
    smoke: 需要真实后端/工作流的冒烟检查
    repro: 一次性复现/诊断脚本，不作为回归

python_files = test_*.py
python_classes = Test*
python_functions = test_*

consider_namespace_packages = true

filterwarnings =
    default
