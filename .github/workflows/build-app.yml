name: Build panel app

on:
  push:
    branches: [main]
    paths: ['panel/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install dependencies
        run: cd panel && npm ci

      - name: Build & deploy app/
        run: cd panel && npm run build:comfyui

      - name: Commit rebuilt app/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/
          if git diff --cached --quiet; then
            echo "app/ unchanged — nothing to commit"
          else
            git commit -m "chore: rebuild panel app"
            git push
          fi
